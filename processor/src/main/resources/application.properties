spring.application.name=processor

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ritfast_saas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Saikrishna@123}

# Explicitly set the dialect to prevent startup errors if the DB connection is slow or fails
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# This tells Hibernate to auto-create the tables based on our Entities!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Show error messages in responses
server.error.include-message=always
server.error.include-binding-errors=always
